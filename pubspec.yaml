name: my_device
description: "MyDevice!!!!! — Your personal device inventory"
publish_to: 'none'

version: 1.5.4+43

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared WebDAV sync & data-management engines, embedded as a git submodule.
  # The submodule commit is the lockfile — pub does not lock path deps.
  # After a fresh clone: git submodule update --init
  myapps_data:
    path: packages/myapps_data

  # State management
  flutter_riverpod: ^1.0.4

  # Navigation
  go_router: ^14.8.1

  # Theming
  flex_color_scheme: ^8.2.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0

  # i18n
  intl: ^0.20.2
  fl_chart: ^0.70.2

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: 10.3.7
  share_plus: ^10.1.4
  package_info_plus: ^9.0.0
  device_preview: ^1.2.0
  wakelock_plus: ^1.5.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.4.0

  # Archive
  archive: ^4.0.4

  # Local HTTP API server (desktop)
  shelf: ^1.4.0
  shelf_router: ^1.1.0

  # System tray & window management (desktop)
  tray_manager: ^0.2.3
  window_manager: ^0.4.3

  # Auto-start on boot (desktop)
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0
  msix: ^3.16.8
  path_provider_platform_interface: ^2.1.2

flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/icon/
    - assets/logos/
    - assets/presets/

msix_config:
  display_name: MyDevice!!!!!
  publisher_display_name: yuanzhe
  identity_name: com.yuanzhe.mydevice
  msix_version: 1.5.4.0
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient
  install_certificate: false
